services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: stack_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - stack_net
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: stack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - stack_net
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: stack_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - stack_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - stack_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: stack_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - stack_net
    depends_on:
      - db

networks:
  stack_net:

volumes:
  stack_db_data:
